server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/lms
    username: lms
    password: lms_pwd
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
